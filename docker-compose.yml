services:
  postgres:
    image: postgres:16-alpine
    container_name: openbrain-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - '5433:5432'
    volumes:
      - openbrain-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: openbrain-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_PORT: 4004
      APP_ENV: local
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: postgres
      JWT_ACCESS_SECRET: openbrain-dev-secret
      JWT_ACCESS_EXPIRES_IN: 7d
    ports:
      - '4004:4004'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: openbrain-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:4004
    ports:
      - '5173:5173'

volumes:
  openbrain-postgres-data:
